name: Publish release build
run-name: "Publish image for ${{ github.event.release.tag_name }}"

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish-release-staging
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ref.outputs.version }}
      commit_sha: ${{ steps.ref.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve release tag
        id: ref
        env:
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$VERSION" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Expected a semantic version release tag"
            exit 1
          fi
          commit_sha=$(git rev-parse --verify "refs/tags/${VERSION}^{commit}")
          git merge-base --is-ancestor "$commit_sha" origin/main
          echo "version=${VERSION#v}" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$commit_sha" >> "$GITHUB_OUTPUT"

  quality:
    needs: prepare
    uses: ./.github/workflows/code-check.yml
    with:
      commit_sha: ${{ needs.prepare.outputs.commit_sha }}

  build-and-publish:
    needs: [prepare, quality]
    uses: ./.github/workflows/build-docker-image.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      commit_sha: ${{ needs.prepare.outputs.commit_sha }}
    secrets: inherit

  trigger-staging-deploy:
    runs-on: ubuntu-latest
    environment: staging
    needs: [prepare, build-and-publish]
    steps:
      - name: Trigger staging deploy
        uses: neti-filplus-infra/filplus-deploy-action@main
        with:
          version: ${{ needs.prepare.outputs.version }}
          environment: staging
          ecr-repository: hyperion
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_IMAGE_DEPLOYER }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_IMAGE_DEPLOYER }}
          aws-region: us-east-1
